<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Danke — WireTrack</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050a14" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #050a14; --fg: #e8edf5; --muted: #7a8ba8; --accent: #3b82f6; --accent-2: #60a5fa; }
        body {
            font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--fg);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 24px;
        }
        .bg-grid {
            position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><path d="M60 0v60H0" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/></svg>');
            background-size: 60px 60px;
        }
        .bg-glow {
            position: fixed; top: 30%; left: 50%; width: 600px; height: 600px;
            transform: translateX(-50%); border-radius: 50%;
            background: radial-gradient(circle, rgba(59,130,246,0.1), transparent 70%);
            z-index: -1; pointer-events: none;
        }
        .card {
            background: rgba(10,17,33,0.6); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px; padding: 48px 40px; max-width: 520px; width: 100%;
            animation: pop 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes pop {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .icon {
            width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 24px;
            background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(6,182,212,0.1));
            display: flex; align-items: center; justify-content: center; font-size: 2.5rem;
            animation: icon-bounce 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
        }
        @keyframes icon-bounce {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 12px; }
        p { color: var(--muted); font-size: 1.05rem; line-height: 1.7; margin-bottom: 8px; }
        .highlight { color: var(--accent-2); font-weight: 600; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px; margin-top: 32px;
            padding: 14px 32px; background: var(--accent); color: #fff;
            font-size: 1rem; font-weight: 600; border-radius: 12px; text-decoration: none;
            transition: all 0.25s; box-shadow: 0 4px 20px rgba(59,130,246,0.25);
        }
        .btn:hover { background: var(--accent-2); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(59,130,246,0.4); }
        .footer { margin-top: 48px; font-size: 0.8rem; color: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div class="card">
        <div class="icon">✅</div>
        <h1>Vielen Dank!</h1>
        <p>Deine Nachricht ist bei uns angekommen.</p>
        <p>Wir melden uns <span class="highlight">innert 24 Stunden</span> bei dir zurück.</p>
        <a href="/" class="btn">
            ← Zurück zur Startseite
        </a>
    </div>

    <div class="footer">WireTrack — Das Betriebssystem für die Baubranche</div>
</body>
</html>
